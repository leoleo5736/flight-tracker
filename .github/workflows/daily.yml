name: 每日抓機票價格
on:
  schedule:
    - cron: "0 1 * * *"   # UTC 01:00 = 台北時間 09:00
  workflow_dispatch:
permissions:
  contents: write
jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4
      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安裝套件
        run: pip install -r requirements.txt
      - name: 抓價格
        env:
          SHEET_WEBAPP_URL: ${{ secrets.SHEET_WEBAPP_URL }}
          SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
        run: python scrape.py
      - name: 把新資料存回 repo
        run: |
          git config user.name "flight-bot"
          git config user.email "flight-bot@users.noreply.github.com"
          git add prices.csv
          if git diff --staged --quiet; then
            echo "價格沒變動, 不需要 commit"
          else
            git commit -m "價格更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git push
          fi
